<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="overlay-container">
    <!-- Drag handle for moving overlay -->
    <div class="drag-handle" id="dragHandle" data-label="" title=""></div>
    
    <div class="resize-handle resize-handle-right"></div>
    
    <!-- Floating close button (keeps layout stable while resizing) -->
    <div class="info-btn-container">
      <button class="close-btn" id="infoBtn" title="">ℹ</button>
    </div>
    <div class="close-btn-container">
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    
    <!-- Pinned Sections Area -->
    <div class="pinned-sections" id="pinnedSections"></div>
    
    <!-- Sections Container - 3 columns -->
    <div class="sections-container">
    
    <!-- Ask Section -->
    <div class="collapsible-section" data-panel="ask">
      <button class="section-header" onclick="toggleSection(event, this)">
        <span id="askHeaderLabel"></span>
        <span class="section-toggle">▼</span>
      </button>
      <div class="section-content">
        <div class="section-content-inner">
          <div class="block-shelf" data-panel="ask">
            <div class="block-item" id="block-ask-main" data-block-id="ask-main" data-block-home="ask" data-block-title-key="tabAsk">
              <button id="micBtn"></button>
              <input type="text" id="questionInput" placeholder="" onclick="event.stopPropagation()" />
              <button id="askBtn"></button>

              <!-- Vision Controls -->
              <div class="vision-controls">
                <button class="vision-btn" id="screenshotBtn"></button>
                <button class="vision-btn" id="clearImageBtn" style="display: none;"></button>
              </div>
              <img id="screenshotPreview" alt="Screenshot preview" />
              <p class="screenshot-info" id="screenshotInfo"></p>
              <p id="status"></p>
              <div id="responseContainer" style="display: none;">
                <p id="answerLabel"></p>
                <p id="aiResponse"></p>
              </div>
              <div class="fact-capture-actions" style="display: flex; gap: 8px; margin-top: 8px;">
                <button id="addFactBtn" style="flex: 1; padding: 8px; background: rgba(91, 158, 255, 0.2); border: 1px solid rgba(91, 158, 255, 0.4); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
              </div>
              <div class="vision-consent-block">
                <label class="vision-consent-toggle">
                  <input type="checkbox" id="visionEnableToggle" style="width: 18px; height: 18px; cursor: pointer;" onclick="event.stopPropagation()">
                  <span id="visionEnableLabel"></span>
                </label>
                <p class="vision-consent-hint" id="visionConsentHint"></p>
                <div class="vision-consent-columns">
                  <div class="vision-consent-col">
                    <div class="vision-consent-subtitle" id="visionAllowListLabel"></div>
                    <textarea id="visionAllowListInput" rows="4" style="width: 100%; resize: vertical; margin-top: 6px; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;"></textarea>
                  </div>
                  <div class="vision-consent-col">
                    <div class="vision-consent-subtitle" id="visionDenyListLabel"></div>
                    <textarea id="visionDenyListInput" rows="4" style="width: 100%; resize: vertical; margin-top: 6px; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;"></textarea>
                  </div>
                </div>
                <div class="vision-consent-actions">
                  <button id="visionConsentSaveBtn" style="flex: 1; padding: 8px; background: rgba(91, 158, 255, 0.2); border: 1px solid rgba(91, 158, 255, 0.4); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
                  <button id="visionConsentResetBtn" style="flex: 1; padding: 8px; background: rgba(255, 196, 100, 0.15); border: 1px solid rgba(255, 196, 100, 0.35); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
                </div>
              </div>
            </div>
            <div class="specialization-container block-item" id="block-game-template" data-block-id="game-template" data-block-home="ask" data-block-title-key="gameTemplateLabel" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="gameTemplateLabel"></span>
              </div>
              <p id="gameTemplateHint" style="font-size: 0.8em; color: #8ba3c0; margin-top: 6px; line-height: 1.4;"></p>
              <input type="text" id="gameTemplateNameInput" style="width: 100%; margin-top: 6px; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
              <div class="specialization-label" style="margin-top: 8px;">
                <span id="gameTemplateOptionsLabel"></span>
              </div>
              <p id="gameTemplateOptionsHint" style="font-size: 0.8em; color: #8ba3c0; margin-top: 4px; line-height: 1.4;"></p>
              <div id="gameTemplateOptionsList" style="display: grid; gap: 6px; margin-top: 6px;"></div>
              <p id="gameTemplateOptionsLimit" style="font-size: 0.75em; color: #6f839c; margin-top: 4px; line-height: 1.4;"></p>
              <div class="specialization-label" style="margin-top: 8px;">
                <span id="gameTemplateCustomLabel"></span>
              </div>
              <textarea id="gameTemplateText" rows="6" style="width: 100%; resize: vertical; margin-top: 6px; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder=""></textarea>
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button id="gameTemplateLoadBtn" style="flex: 1; padding: 8px; background: rgba(91, 158, 255, 0.2); border: 1px solid rgba(91, 158, 255, 0.4); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
                <button id="gameTemplateUseCurrentBtn" style="flex: 1; padding: 8px; background: rgba(120, 140, 170, 0.2); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
              </div>
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button id="gameTemplateSaveBtn" style="flex: 1; padding: 8px; background: rgba(91, 158, 255, 0.2); border: 1px solid rgba(91, 158, 255, 0.4); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
                <button id="gameTemplateDeleteBtn" style="flex: 1; padding: 8px; background: rgba(255, 100, 100, 0.15); border: 1px solid rgba(255, 100, 100, 0.35); border-radius: 6px; color: #ffb0b0; cursor: pointer; font-size: 0.9em;"></button>
              </div>
              <p id="gameTemplateStatus" style="font-size: 0.8em; color: #8ba3c0; margin-top: 6px; line-height: 1.4;"></p>
            </div>
          </div>
        </div>
        <div class="popup-resize-handle"></div>
      </div>
    </div>
    
    <!-- History Section -->
    <div class="collapsible-section" data-panel="history">
      <button class="section-header" id="historyHeaderBtn" onclick="toggleSection(event, this)">
        <span id="historyHeaderLabel"></span>
        <span class="section-toggle">▼</span>
      </button>
      <div class="section-content history-section">
        <div class="section-content-inner">
          <div class="block-shelf" data-panel="history">
            <div class="block-item" id="block-history-list" data-block-id="history-list" data-block-home="history" data-block-title-key="history">
              <div class="history-search" id="historySearch">
                <input type="text" id="historySearchInput" placeholder="" />
                <label class="history-search-toggle">
                  <input type="checkbox" id="historyPinnedOnlyToggle" />
                  <span id="historyPinnedOnlyLabel"></span>
                </label>
              </div>
              <div class="history-search-meta" id="historySearchMeta"></div>
              <div id="historyList"></div>
            </div>
            <div class="block-item" id="block-history-actions" data-block-id="history-actions" data-block-home="history" data-block-title-key="clearHistory">
              <div class="history-controls">
                <button class="history-clear-btn" id="clearHistoryBtn"></button>
              </div>
            </div>
          </div>
        </div>
        <div class="popup-resize-handle"></div>
      </div>
    </div>
    
    <!-- Settings Section -->
    <div class="collapsible-section" data-panel="settings">
      <button class="section-header" onclick="toggleSection(event, this)">
        <span id="settingsHeaderLabel"></span>
        <span class="section-toggle">▼</span>
      </button>
      <div class="section-content">
        <div class="section-content-inner">
          <div class="block-shelf" data-panel="settings">
            <div class="specialization-container block-item" id="block-spec" data-block-id="spec" data-block-home="settings" data-block-title-key="specializationLabel">
              <div class="specialization-label">
                <span id="specLabel"></span>
                <span class="specialization-value"><span id="specValue">3</span>/5</span>
              </div>
              <input type="range" id="specializationLevel" min="1" max="5" value="3" onclick="event.stopPropagation()">
              <p id="specDetail" style="font-size: 0.8em; color: #8ba3c0; margin-top: 8px; line-height: 1.4;"></p>
            </div>

            <div class="specialization-container block-item" id="block-tts" data-block-id="tts" data-block-home="settings" data-block-title-key="ttsLabel" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="ttsLabel"></span>
              </div>
              <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #f5f7fa;">
                <input type="checkbox" id="enableTTS" checked style="width: 18px; height: 18px; cursor: pointer;" onclick="event.stopPropagation()">
                <span id="askTtsLabel"></span>
              </label>
              <div class="tts-volume">
                <div class="tts-volume-label">
                  <span id="speechRateLabel"></span>
                  <span id="speechRateValue" class="tts-volume-value">100</span>
                </div>
                <input type="range" id="speechRate" value="100" min="0" max="100" onclick="event.stopPropagation()">
              </div>
            </div>

            <div class="specialization-container block-item" id="block-data" data-block-id="data" data-block-home="settings" data-block-title-key="dataLabel" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="dataLabel"></span>
              </div>
              <button id="exportHistoryBtn" onclick="exportHistory()" style="width: 100%; margin-bottom: 8px; padding: 8px; background: rgba(91, 158, 255, 0.2); border: 1px solid rgba(91, 158, 255, 0.4); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;"></button>
              <button id="clearAllBtn" onclick="clearAllData()" style="width: 100%; padding: 8px; background: rgba(255, 100, 100, 0.2); border: 1px solid rgba(255, 100, 100, 0.4); border-radius: 6px; color: #ff6464; cursor: pointer; font-size: 0.9em;"></button>
            </div>

            <div class="specialization-container block-item" id="block-layout" data-block-id="layout" data-block-home="settings" data-block-title-key="layoutMode" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="layoutLabel"></span>
              </div>
              <button class="reset-layout-btn" id="toggleLayoutBtn"></button>
              <button class="reset-layout-btn" id="resetLayoutBtn"></button>
            </div>

            <div class="specialization-container block-item" id="block-note" data-block-id="note" data-block-home="settings" data-block-title-key="notePanelBtn" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="notePanelLabel"></span>
              </div>
              <div class="note-preview" id="notePanelPreview"></div>
              <button class="reset-layout-btn" id="notePanelBtn"></button>
            </div>

            <div class="specialization-container block-item" id="block-free-layout" data-block-id="free-layout" data-block-home="settings" data-block-title-key="compositionModeLabel" style="margin-top: 12px;">
              <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #f5f7fa;">
                <input type="checkbox" id="freeLayoutToggle" style="width: 18px; height: 18px; cursor: pointer;" onclick="event.stopPropagation()">
                <span id="compositionModeLabel"></span>
              </label>
            </div>

            <!-- dev-only:start -->
            <div class="specialization-container block-item" id="block-dev-tools" data-block-id="dev-tools" data-block-home="settings" data-block-title-key="devToolsLabel" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="devToolsLabel"></span>
              </div>
              <p id="devToolsHint" style="font-size: 0.8em; color: #8ba3c0; margin-top: 6px; line-height: 1.4;"></p>

              <div class="dev-tools-card">
                <div class="dev-tools-card-title" id="aiDiagnosticsLabel"></div>
                <label class="dev-tools-toggle">
                  <input type="checkbox" id="aiDiagnosticsToggle" style="width: 18px; height: 18px; cursor: pointer;" onclick="event.stopPropagation()">
                  <span id="aiDiagnosticsToggleLabel"></span>
                </label>
                <p id="aiDiagnosticsHint" class="dev-tools-hint"></p>
              </div>

              <div class="dev-tools-card">
                <div class="dev-tools-card-title" id="perfHudLabel"></div>
                <label class="dev-tools-toggle">
                  <input type="checkbox" id="perfHudToggle" style="width: 18px; height: 18px; cursor: pointer;" onclick="event.stopPropagation()">
                  <span id="perfHudToggleLabel"></span>
                </label>
              </div>

              <div class="dev-tools-card">
                <div class="dev-tools-card-title" id="debugMapLabel"></div>
                <button class="reset-layout-btn" id="debugMapToggleBtn"></button>
              </div>

              <div class="dev-tools-card">
                <div class="dev-tools-row">
                  <div class="dev-tools-card-title" id="factRequestsLabel"></div>
                  <button class="dev-tools-btn" id="factRequestsRefreshBtn"></button>
                </div>
                <div class="dev-tools-row" style="margin-top: 6px;">
                  <label class="dev-tools-inline-label" for="factRequestsGameInput" id="factRequestsGameLabel"></label>
                  <input type="text" id="factRequestsGameInput" class="dev-tools-input" placeholder="" />
                </div>
                <div id="factRequestsList" class="dev-tools-list"></div>
              </div>

              <div class="dev-tools-card">
                <div class="dev-tools-row">
                  <div class="dev-tools-card-title" id="hotGamesLabel"></div>
                  <button class="dev-tools-btn" id="hotGamesRefreshBtn"></button>
                </div>
                <div id="hotGamesList" class="dev-tools-list"></div>
              </div>
            </div>
            <!-- dev-only:end -->

            <div class="specialization-container block-item" id="block-version" data-block-id="version" data-block-home="settings" data-block-title-key="versionLabel" style="margin-top: 12px;">
              <div class="specialization-label">
                <span id="versionLabel"></span>
              </div>
              <p style="font-size: 0.85em; color: #8ba3c0;">
                <span id="versionLine1"></span><br>
                <span id="versionLine2"></span>
              </p>
            </div>
          </div>
        </div>
        <div class="popup-resize-handle"></div>
      </div>
    </div>
    
    </div><!-- Close sections-container -->
  </div><!-- Close overlay-container -->

  <div id="block-stash" style="display: none;"></div>

  <!-- dev-only:start -->
  <div id="debugMapOverlay" class="debug-map-overlay" style="display: none;">
    <div class="debug-map-panel">
      <div class="debug-map-header">
        <div class="debug-map-title" id="debugMapTitle"></div>
        <div class="debug-map-actions">
          <button class="debug-map-btn" id="debugMapRefreshBtn"></button>
          <button class="debug-map-btn" id="debugMapCloseBtn">✕</button>
        </div>
      </div>
      <div class="debug-map-body">
        <div class="debug-map-canvas-wrap">
          <canvas id="debugMapCanvas"></canvas>
        </div>
        <div class="debug-map-issues">
          <div class="debug-map-issues-title" id="debugMapIssuesTitle"></div>
          <div id="debugMapIssuesList"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- dev-only:end -->

  <!-- Floating host for dropdown panels -->
  <div id="floating-panels"></div>
  
  <!-- Custom Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="modalCancel"></button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirm"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="visionConsentModal">
    <div class="modal-content modal-content-consent">
      <div class="modal-title" id="visionConsentTitle"></div>
      <div class="modal-message" id="visionConsentMessage"></div>
      <div class="modal-buttons modal-buttons-grid">
        <button class="modal-btn modal-btn-confirm" id="visionConsentAllowOnce"></button>
        <button class="modal-btn" id="visionConsentAllowAlways"></button>
        <button class="modal-btn modal-btn-danger" id="visionConsentDenyAlways"></button>
        <button class="modal-btn modal-btn-cancel" id="visionConsentCancel"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="factModal">
    <div class="modal-content">
      <div class="modal-title" id="factModalTitle"></div>
      <div class="modal-message" id="factModalHint"></div>
      <div style="display: grid; gap: 10px;">
        <div>
          <div id="factGameLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <input type="text" id="factGameInput" style="width: 100%; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
        </div>
        <div>
          <div id="factTextLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <textarea id="factTextInput" rows="4" style="width: 100%; resize: vertical; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder=""></textarea>
        </div>
        <div>
          <div id="factKeywordsLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <input type="text" id="factKeywordsInput" style="width: 100%; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
        </div>
        <div>
          <div id="factTagsLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <input type="text" id="factTagsInput" style="width: 100%; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
        </div>
      </div>
      <div id="factModalStatus" style="font-size: 0.8em; color: #8ba3c0; margin-top: 8px;"></div>
      <div class="modal-buttons" style="margin-top: 12px;">
        <button class="modal-btn modal-btn-cancel" id="factModalCancel"></button>
        <button class="modal-btn modal-btn-confirm" id="factModalSave"></button>
      </div>
    </div>
  </div>

  
  
  <script src="./src/renderer/overlay/ipc-helpers.js"></script>
  <script src="./src/renderer/overlay/boot.js"></script>
  <script src="./src/renderer/overlay/panel-order.js"></script>
  <script src="./src/renderer/overlay/window-resize.js"></script>
  <script src="./src/renderer/overlay/translations.js"></script>
  <!-- dev-only:start -->
  <script src="./src/renderer/overlay/perf.js"></script>
  <!-- dev-only:end -->
  <script src="./src/renderer/overlay/settings-controls.js"></script>
  <script src="./src/renderer/overlay/history.js"></script>
  <script src="./src/renderer/overlay/blocks.js"></script>
  <script src="./src/renderer/overlay/blocks-window.js"></script>
  <script src="./src/renderer/overlay/ui.js"></script>
  <!-- dev-only:start -->
  <script src="./src/renderer/overlay/debug-map.js"></script>
  <!-- dev-only:end -->
  <script src="./src/renderer/overlay/detach.js"></script>
  <script src="./src/renderer/overlay/ipc.js"></script>
</body>
</html>

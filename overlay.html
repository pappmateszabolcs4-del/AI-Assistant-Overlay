<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="overlay-container">
    <!-- Drag handle for moving overlay -->
    <div class="drag-handle" id="dragHandle" data-label="⇕ Move overlay" title="Move overlay"></div>
    
    <div class="resize-handle resize-handle-left"></div>
    <div class="resize-handle resize-handle-right"></div>
    
    <!-- Floating close button (keeps layout stable while resizing) -->
    <div class="info-btn-container">
      <button class="close-btn" id="infoBtn" title="Info">ℹ</button>
    </div>
    <div class="close-btn-container">
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    
    <!-- Pinned Sections Area -->
    <div class="pinned-sections" id="pinnedSections"></div>
    
    <!-- Sections Container - 3 columns -->
    <div class="sections-container">
    
    <!-- Ask Section -->
    <div class="collapsible-section" data-panel="ask">
      <button class="section-header" onclick="toggleSection(event, this)">
        <span id="askHeaderLabel">💬 Kérdezz</span>
        <span class="section-toggle">▼</span>
      </button>
      <div class="section-content">
        <div class="section-content-inner">
          <button id="micBtn">🎤 Mikrofon</button>
          <input type="text" id="questionInput" placeholder="Írj ide kérdést..." onclick="event.stopPropagation()" />
          <button id="askBtn">💬 Kérdés küldése</button>
          
          <!-- Vision Controls -->
          <div class="vision-controls">
            <button class="vision-btn" id="screenshotBtn">📸 Screenshot</button>
            <button class="vision-btn" id="clearImageBtn" style="display: none;">🗑️ Törlés</button>
          </div>
          <img id="screenshotPreview" alt="Screenshot preview" />
          <p class="screenshot-info" id="screenshotInfo"></p>
          
          <p id="status"></p>
          <div id="responseContainer" style="display: none;">
            <p id="answerLabel">🤖 AI Válasz:</p>
            <p id="aiResponse"></p>
          </div>
        </div>
        <div class="popup-resize-handle"></div>
      </div>
    </div>
    
    <!-- History Section -->
    <div class="collapsible-section" data-panel="history">
      <button class="section-header" id="historyHeaderBtn" onclick="toggleSection(event, this)">
        <span id="historyHeaderLabel">📜 Előzmények</span>
        <span class="section-toggle">▼</span>
      </button>
      <div class="section-content history-section">
        <div class="section-content-inner">
          <div id="historyList"></div>
          <div class="history-controls">
            <button class="history-clear-btn" id="clearHistoryBtn">🗑️ Előzmények törlése</button>
          </div>
        </div>
        <div class="popup-resize-handle"></div>
      </div>
    </div>
    
    <!-- Settings Section -->
    <div class="collapsible-section" data-panel="settings">
      <button class="section-header" onclick="toggleSection(event, this)">
        <span id="settingsHeaderLabel">⚙️ Beállítások</span>
        <span class="section-toggle">▼</span>
      </button>
      <div class="section-content">
        <div class="section-content-inner">
          <div class="specialization-container">
            <div class="specialization-label">
              <span id="specLabel">🎯 Játék Specifikusság:</span>
              <span class="specialization-value"><span id="specValue">3</span>/5</span>
            </div>
            <input type="range" id="specializationLevel" min="1" max="5" value="3" onclick="event.stopPropagation()">
            <p id="specDetail" style="font-size: 0.8em; color: #8ba3c0; margin-top: 8px; line-height: 1.4;">
              1 = Rövid válaszok | 3 = Részletes | 5 = Maximális részletesség
            </p>
          </div>
          
          <div class="specialization-container" style="margin-top: 12px;">
            <div class="specialization-label">
              <span id="ttsLabel">🔊 Hangos válaszok:</span>
            </div>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #f5f7fa;">
              <input type="checkbox" id="enableTTS" checked style="width: 18px; height: 18px; cursor: pointer;" onclick="event.stopPropagation()">
              <span id="askTtsLabel">AI válasz felolvasása</span>
            </label>
          </div>
          
          <div class="specialization-container" style="margin-top: 12px;">
            <div class="specialization-label">
              <span id="overlaySizeLabel">📏 Overlay méret:</span>
            </div>
            <p id="widthDisplay" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 8px;">
              <span id="widthLabel">Szélesség:</span> <span id="widthValue">650</span><span id="widthUnit">px</span>
            </p>
            <input type="range" id="overlayWidth" min="450" max="900" value="650" style="width: 100%;" onclick="event.stopPropagation()">
          </div>
          
          <div class="specialization-container" style="margin-top: 12px;">
            <div class="specialization-label">
              <span id="dataLabel">💾 Adatok:</span>
            </div>
            <button id="exportHistoryBtn" onclick="exportHistory()" style="width: 100%; margin-bottom: 8px; padding: 8px; background: rgba(91, 158, 255, 0.2); border: 1px solid rgba(91, 158, 255, 0.4); border-radius: 6px; color: #f5f7fa; cursor: pointer; font-size: 0.9em;">
              📥 Előzmények exportálása
            </button>
            <button id="clearAllBtn" onclick="clearAllData()" style="width: 100%; padding: 8px; background: rgba(255, 100, 100, 0.2); border: 1px solid rgba(255, 100, 100, 0.4); border-radius: 6px; color: #ff6464; cursor: pointer; font-size: 0.9em;">
              🗑️ Minden adat törlése
            </button>
          </div>
          
          <div class="specialization-container" style="margin-top: 12px;">
            <div class="specialization-label">
              <span id="layoutLabel">🧩 Layout:</span>
            </div>
            <button class="reset-layout-btn" id="toggleLayoutBtn"></button>
            <button class="reset-layout-btn" id="notePanelBtn"></button>
            <button class="reset-layout-btn" id="resetLayoutBtn">
              🔄 Alapértelmezett elrendezés visszaállítása
            </button>
          </div>
          
          <div class="specialization-container" style="margin-top: 12px;">
            <div class="specialization-label">
              <span id="versionLabel">ℹ️ Verzió:</span>
            </div>
            <p style="font-size: 0.85em; color: #8ba3c0;">
              AI Game Assistant v1.0.0<br>
              © 2026 - Gaming AI Helper
            </p>
          </div>
        </div>
        <div class="popup-resize-handle"></div>
      </div>
    </div>
    
    </div><!-- Close sections-container -->
  </div><!-- Close overlay-container -->

  <!-- Floating host for dropdown panels -->
  <div id="floating-panels"></div>
  
  <!-- Custom Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">⚠️ Megerősítés</div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="modalCancel">Mégse</button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirm">Törlés</button>
      </div>
    </div>
  </div>

  
  
  <script src="./src/renderer/overlay/ipc-helpers.js"></script>
  <script src="./src/renderer/overlay/boot.js"></script>
  <script src="./src/renderer/overlay/panel-order.js"></script>
  <script src="./src/renderer/overlay/window-resize.js"></script>
  <script src="./src/renderer/overlay/translations.js"></script>
  <script src="./src/renderer/overlay/settings-controls.js"></script>
  <script src="./src/renderer/overlay/history.js"></script>
  <script src="./src/renderer/overlay/ui.js"></script>
  <script src="./src/renderer/overlay/detach.js"></script>
  <script src="./src/renderer/overlay/ipc.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="block-root"></div>
  <div id="pinnedSections" style="display: none;"></div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="modalCancel"></button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirm"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="visionConsentModal">
    <div class="modal-content modal-content-consent">
      <div class="modal-title" id="visionConsentTitle"></div>
      <div class="modal-message" id="visionConsentMessage"></div>
      <div class="modal-buttons modal-buttons-grid">
        <button class="modal-btn modal-btn-confirm" id="visionConsentAllowOnce"></button>
        <button class="modal-btn" id="visionConsentAllowAlways"></button>
        <button class="modal-btn modal-btn-danger" id="visionConsentDenyAlways"></button>
        <button class="modal-btn modal-btn-cancel" id="visionConsentCancel"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="factModal">
    <div class="modal-content">
      <div class="modal-title" id="factModalTitle"></div>
      <div class="modal-message" id="factModalHint"></div>
      <div style="display: grid; gap: 10px;">
        <div>
          <div id="factGameLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <input type="text" id="factGameInput" style="width: 100%; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
        </div>
        <div>
          <div id="factTextLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <textarea id="factTextInput" rows="4" style="width: 100%; resize: vertical; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder=""></textarea>
        </div>
        <div>
          <div id="factKeywordsLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <input type="text" id="factKeywordsInput" style="width: 100%; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
        </div>
        <div>
          <div id="factTagsLabel" style="font-size: 0.85em; color: #8ba3c0; margin-bottom: 4px;"></div>
          <input type="text" id="factTagsInput" style="width: 100%; padding: 8px; background: rgba(20, 24, 31, 0.85); border: 1px solid rgba(120, 140, 170, 0.35); border-radius: 6px; color: #f5f7fa; font-size: 0.85em;" placeholder="" />
        </div>
      </div>
      <div id="factModalStatus" style="font-size: 0.8em; color: #8ba3c0; margin-top: 8px;"></div>
      <div class="modal-buttons" style="margin-top: 12px;">
        <button class="modal-btn modal-btn-cancel" id="factModalCancel"></button>
        <button class="modal-btn modal-btn-confirm" id="factModalSave"></button>
      </div>
    </div>
  </div>

  <div id="toastHost" class="toast-host"></div>

  <div class="modal-overlay" id="errorModal">
    <div class="modal-content error-modal">
      <div class="modal-title" id="errorModalTitle"></div>
      <div class="modal-message" id="errorModalMessage"></div>
      <button class="modal-btn modal-btn-secondary" id="errorModalDetailsToggle" type="button"></button>
      <div class="error-modal-details" id="errorModalDetails"></div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="errorModalClose"></button>
        <button class="modal-btn modal-btn-confirm" id="errorModalAction"></button>
      </div>
    </div>
  </div>

  <script src="./src/renderer/overlay/ipc-helpers.js"></script>
  <script src="./src/renderer/overlay/boot.js"></script>
  <script src="./src/renderer/overlay/translations.js"></script>
  <script src="./src/renderer/overlay/history.js"></script>
  <script src="./src/renderer/overlay/block-app.js"></script>
  <script src="./src/renderer/overlay/blocks-window.js"></script>
</body>
</html>
